<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Librarian Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><h1>📚 Librarian Dashboard</h1><button onclick="logout()">Logout</button></header><main><div id="analytics" class="stats"></div><section class="panel"><h2>Add Book</h2><form id="bookForm"><input id="title" placeholder="Book title" required><input id="author" placeholder="Author" required><input id="category" placeholder="Category"><input id="quantity" type="number" min="1" placeholder="Quantity" required><button>Add Book</button></form></section><section class="panel"><h2>Add Student</h2><form id="studentForm"><input id="studentName" placeholder="Student name" required><input id="studentEmail" type="email" placeholder="Email" required><input id="studentPassword" type="password" placeholder="Password" required><button>Add Student</button></form></section><h2>Books</h2><div id="books"></div><h2>Students</h2><div id="students"></div></main><script src="librarian.js"></script></body></html>
